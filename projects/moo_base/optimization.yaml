# optimization dependencies
evaluator:
  name: zdt1
  kwargs:
    dim: 30
optimizer:
  name: nsga2
  kwargs:
    seed: 42
    bounds: [0.0, 1.0]

# optimization settings
num_iteration: 30

# output functionality
output_interval: 1
output_control:
  best_individual:
    filename_base: best_individual
    enabled: True
    output_interval: 1
  candidate:
    filename_base: candidate
    enabled: False
    output_interval: 1
  candidate_plot:
    filename_base: candidate_plot.png
    enabled: True
    output_interval: 10
enable_progress_gui: True
