# optimization dependencies
evaluator:
  name: pyemsol_shape_evaluator
optimizer:
  name: cmaes
  kwargs:
    seed: 42
level_set_function:
  name: ngnet
  kwargs:
    sigma: 0.04
    design_region: [[0, 0.140], [0, 0.140], [0, 0.140]]
    dimension: 3D
    coordinate: Cartesian

# optimization settings
num_iteration: 100
enable_parallelization: True
num_processes: Null  # if Null, automatically set from cpu counts

# output functionality
output_interval: 1
output_control:
  best_individual:
    filename_base: best_individual
    enabled: True
    output_interval: 1
  candidate:
    filename_base: candidate
    enabled: False
    output_interval: 1
  candidate_plot:
    filename_base: candidate_plot
    enabled: True
    output_interval: 10
enable_progress_gui: True
